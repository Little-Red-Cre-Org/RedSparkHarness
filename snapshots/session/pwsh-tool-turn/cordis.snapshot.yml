# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-deepseek
  name: '@redspark/rsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@redspark/rsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@redspark/rsh-subprocess-local'

- id: bash-sandbox
  name: '@redspark/rsh-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@redspark/rsh-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@redspark/rsh-shell-env'

- id: agent-default-model
  name: '@redspark/rsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@redspark/rsh-session-persistence-jsonl'
  config:
    root: !!js rshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@redspark/rsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@redspark/rsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@redspark/rsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@redspark/rsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@redspark/rsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@redspark/rsh-tool-goal'
  disabled: true

- id: skill
  name: '@redspark/rsh-skill'
  disabled: true

- id: archify
  name: '@redspark/rsh-archify'
  disabled: true

- id: skill-filesystem
  name: '@redspark/rsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@redspark/rsh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@redspark/rsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@redspark/rsh-tool-pwsh'
  disabled: false
