# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-deepseek
  name: '@redspark/rsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@redspark/rsh-subprocess-local'

- id: agent-default-model
  name: '@redspark/rsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@redspark/rsh-session-persistence-jsonl'
  config:
    root: !!js rshHomePath('sessions')
    compression: !!js 'process.env.RSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@redspark/rsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@redspark/rsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@redspark/rsh-tool-jobs'
  disabled: true

- id: goal
  name: '@redspark/rsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@redspark/rsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@redspark/rsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@redspark/rsh-tool-goal'
  disabled: true

- id: skill
  name: '@redspark/rsh-skill'
  disabled: true

- id: archify
  name: '@redspark/rsh-archify'
  disabled: true

- id: skill-filesystem
  name: '@redspark/rsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@redspark/rsh-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@redspark/rsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@redspark/rsh-spill-local'
  config:
    root: !!js process.env.RSH_SNAPSHOT_SPILL_ROOT ?? '.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../rsh/Scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.RSH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.RSH_SNAPSHOT_SPILL_LOCATOR_ROOT
