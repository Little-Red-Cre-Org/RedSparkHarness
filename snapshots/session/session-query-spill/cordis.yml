# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# the base cordis.yml, so this overlay adds only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@redspark/rsh-spill-local'
  config:
    root: !!js process.env.RSH_SNAPSHOT_SPILL_ROOT ?? '.spill'

- id: spill-policy
  name: '@redspark/rsh-spill-policy'
  config:
    maxInlineBytes: !!js process.env.RSH_SNAPSHOT && 800 || 50000

# Explicit session-query tool opt-in for the dedicated spill scenario. The
# nested filesystem overlay supplies private spill storage and its byte limit.
- insert:
    - id: tool-session-query
      name: '@redspark/rsh-tool-session-query'

- id: timeout-policy
  name: '@redspark/rsh-tool-call-timeout-policy'

- insert:
    - id: snapshot-spill-locators
      name: ../../../rsh/Scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.RSH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.RSH_SNAPSHOT_SPILL_LOCATOR_ROOT

- insert:
    - id: query-spill-verification-path
      name: ./resolve-spill-command.mjs
