# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-deepseek
  name: '@redspark/rsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@redspark/rsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@redspark/rsh-session-persistence-jsonl'
  config:
    root: !!js process.env.RSH_SNAPSHOT_SESSIONS_ROOT ?? rshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@redspark/rsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@redspark/rsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../rsh/Scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/dsh-escalated.txt && cat /tmp/dsh-escalated.txt && rm /tmp/dsh-escalated.txt"
        recordedPath: /tmp/dsh-escalated.txt
        livePath: !!js process.env.RSH_SNAPSHOT_SPILL_ROOT + '/dsh-escalated.txt'
