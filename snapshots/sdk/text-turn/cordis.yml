# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

# This recorded composition owns Bash schemas on every replay host.
- id: bash-sandbox
  disabled: false

- id: pwsh-sandbox
  disabled: true

- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@redspark/rsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@redspark/rsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@redspark/rsh-session-persistence-jsonl'
  config:
    root: !!js rshHomePath('sessions')
    compression: !!js "process.env.RSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@redspark/rsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-deepseek
  name: '@redspark/rsh-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: snapshot-message-feedback
      name: '@redspark/rsh-message-feedback'
      disabled: !!js "process.env.RSH_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.RSH_SNAPSHOT_FEEDBACK !== '1'"
