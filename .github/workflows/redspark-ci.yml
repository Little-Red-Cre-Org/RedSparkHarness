name: RedSpark Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redspark-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'

jobs:
  client:
    name: SPH / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web and desktop sources
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck:contracts-ready
      - name: Client tests (no API credentials)
        run: pnpm run test:gui --maxWorkers=2
      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm run lint:contracts-ready
      - name: Documentation checks
        if: runner.os == 'Linux'
        run: pnpm run doc-sync
