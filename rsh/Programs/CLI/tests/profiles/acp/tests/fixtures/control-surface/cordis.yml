# Keyless generic ACP v1 control-surface patch over the custom legacy ACP profile.

- id: llm-deepseek
  name: '@redspark/rsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@redspark/rsh-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@redspark/rsh-session-persistence-jsonl'
  config:
    root: !!js process.env.RSH_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
