# Opt-in scheduled Agent work over a Web profile; existing reminders stay independent.
- insert:
    - id: task-scheduler
      name: '@deepseek-ai/dsh-task-scheduler'
      config:
        path: !!js dshHomePath('task-scheduler.sqlite')
        pollMs: 1000
        runTimeoutMs: 600000
        maxConcurrent: 1
        historyLimit: 50
        minEverySeconds: 300
