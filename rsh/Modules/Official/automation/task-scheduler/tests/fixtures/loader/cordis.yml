- name: '@redspark/rsh-llm'
- name: '@redspark/rsh-session'
- name: '@redspark/rsh-session-persistence-jsonl'
  config:
    root: ./sessions
- name: '@redspark/rsh-session-projection'
- name: '@redspark/rsh-system-prompt'
- name: '@redspark/rsh-tools'
- name: '@redspark/rsh-agent'
- name: '@redspark/rsh-goal'
- name: '@redspark/rsh-goal-round-driver'
- name: '@redspark/rsh-agent-loop'
  config:
    agents: []
- name: '@redspark/rsh-subprocess-local'
- name: '@redspark/rsh-sandbox-local'
- name: '@redspark/rsh-sandbox-policy'
- name: '@redspark/rsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
- name: '@redspark/rsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
- name: '@redspark/rsh-user-approval'
  config:
    policy: never
- name: '@redspark/rsh-permission-presets'
  config:
    defaultPreset: read-only
    presets:
      read-only:
        sandbox: read-only
        approval: never
- name: '@redspark/rsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 200
- name: '@redspark/rsh-storage'
- name: '@redspark/rsh-storage-json'
  config:
    root: ./storage
- name: '@redspark/rsh-storage-domain'
  config:
    backend: json
- name: '@redspark/rsh-workspace'
- name: '@redspark/rsh-agent-presets'
  config:
    default: test
    includeShippedRoot: false
    includeUserRoot: false
    roots:
      - path: ./presets
        trust: system
- name: ./mock-model.ts
- id: task-scheduler
  name: ../../../src/index.ts
  config:
    path: !!js "process.cwd() + '/tasks.sqlite'"
    pollMs: 100
    runTimeoutMs: 10000
    maxConcurrent: 1
    historyLimit: 10
    minEverySeconds: 300
