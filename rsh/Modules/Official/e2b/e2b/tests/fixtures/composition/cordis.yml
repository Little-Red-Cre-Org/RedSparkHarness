# One-world invariant for the E2B package composition:
# e2b.cwd and sandbox-policy.workspaceRoot must name the same remote directory,
# which is also bash-local's implicit default workdir.
- id: e2b
  name: '@redspark/rsh-e2b'
  config:
    cwd: !!js process.cwd()
    timeoutMs: 180000

- id: subprocess-e2b
  name: '@redspark/rsh-subprocess-e2b'

- id: bash
  name: '@redspark/rsh-bash-local'
  config:
    timeoutMs: 30000

- id: fs-e2b
  name: '@redspark/rsh-fs-e2b'

- id: agents
  name: '@redspark/rsh-agent'

- id: session-projection
  name: '@redspark/rsh-session-projection'

- id: sandbox-policy
  name: '@redspark/rsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: pty
  name: '@redspark/rsh-terminal'

- id: terminal-bash
  name: '@redspark/rsh-terminal-bash'
  config:
    pollIntervalMs: 25
    exactProbeAfterMs: 150
    idleSilenceMs: 2000
    handoffGraceMs: 500
    timeoutMs: 5000
    disposeGraceMs: 1000

- id: lsp
  name: '@redspark/rsh-lsp'

- id: lsp-stdio
  name: '@redspark/rsh-lsp-stdio'
  config:
    servers:
      fixture:
        command: node
        args:
          - !!js process.cwd() + '/fixture-lsp.mjs'
        extensionToLanguage:
          .ts: typescript
        shutdownTimeoutMs: 1000
        killGraceMs: 500
