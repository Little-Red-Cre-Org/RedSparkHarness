# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@redspark/rsh-system-prompt'

- id: tools
  name: '@redspark/rsh-tools'

- id: subprocess
  name: '@redspark/rsh-subprocess-local'

- id: bash
  name: '@redspark/rsh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@redspark/rsh-shell-env'

- id: tasks
  name: '@redspark/rsh-jobs-local'

- id: tool-jobs
  name: '@redspark/rsh-tool-jobs'

- id: tool-pwsh
  name: '@redspark/rsh-tool-pwsh'
