# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@redspark/rsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@redspark/rsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.RSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.RSH_MAX_TOKENS_AS_SUCCESS)"
