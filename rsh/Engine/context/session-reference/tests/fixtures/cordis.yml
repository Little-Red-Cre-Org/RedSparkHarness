- name: '@redspark/rsh-session'
- name: '@redspark/rsh-system-prompt'
- name: '@redspark/rsh-tools'
- name: '@redspark/rsh-fs-local'
- name: '@redspark/rsh-tool-fs'
- name: '@redspark/rsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- name: '@redspark/rsh-session-reference'
  config:
    maxReferenceBytes: 360
- name: './source-session.ts'
- name: '@redspark/rsh-spill-local'
  config:
    root: '{{spillRoot}}'
    cleanupPeriodDays: 0
