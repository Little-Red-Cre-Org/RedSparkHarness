packages:
  - rsh/Core/vendor/*
  - rsh/Core/identity/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under rsh/Core/native/system.
  - rsh/Core/native/system
  - rsh/Core/native/system/packages/*
  - rsh/Core/runtime-diagnostics/*
  - rsh/Core/settings/*
  - rsh/Core/storage/*
  - rsh/Core/subprocess/*
  - rsh/Core/typert/*
  - rsh/Core/util/*
  - rsh/Engine/*/*
  - rsh/Modules/Official/*/*
  - rsh/Modules/Community/*/*
  - rsh/Compatibility/DSH/*/*
  # Product assemblies over the package tier; rsh/Programs/CLI owns the `dsh` bin.
  - rsh/Programs/TUI/*
  - rsh/Programs/CLI
  - rsh/Programs/Desktop
  - rsh/Programs/DesktopHost
  - rsh/Programs/ACP/packages/*
  - rsh/Programs/SDK/packages/*
  - rsh/Programs/Web/application
  - rsh/Programs/Web/api/*
  - rsh/Programs/Web/client/*
  - rsh/Programs/Web/host/*
  - rsh/Tests/test-support/*
  # Private package owning repository-level benchmark dependencies.
  - rsh/Tests/benchmarks
  - rsh/Docs/website
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - rsh/Programs/SDK/python/sdk-runtime

# Vendored framework packages keep their upstream semver ranges, while local
# builds must resolve those matching names to this workspace's pinned sources.
linkWorkspacePackages: true

overrides:
  '@deepseek-ai/cosmokit': 'link:rsh/Core/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:rsh/Core/vendor/schemastery'
  # Security floors for transitive dependencies whose parents still declare
  # vulnerable ranges. Each selector covers only the affected range of one
  # release line, so no consumer crosses a major version. Remove an entry once
  # every parent requires the patched release.
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '^2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  # undici floors are scoped to the parents that pin the 6.x and 7.x lines: a
  # version-range selector would also rewrite openai's `>=5 <9` peer range and
  # move the direct undici 8 peer back to 6.x.
  'node-gyp>undici': '^6.28.1'
  '@electron/get>undici': '^7.29.1'
  '@yao-pkg/pkg-fetch>undici': '^7.29.1'
  'e2b>undici': '^7.29.1'
  'jsdom>undici': '^7.29.1'
  'nanoid@<3.3.18': '^3.3.18'
  'postcss@<8.5.18': '^8.5.18'
  'source-map-js@<1.2.2': '^1.2.2'
  'http-cache-semantics@<4.2.1': '^4.2.1'
  'browserslist@<4.28.7': '^4.28.7'
  'proxy-addr@<2.0.8': '^2.0.8'
  'fast-uri@>=3.0.0 <3.1.8': '^3.1.8'
  'ip-address@>=10.0.0 <10.7.1': '^10.7.1'
  # The MCP reference servers used as mcp-client test fixtures were locked
  # before the SDK fix.
  '@modelcontextprotocol/server-everything>@modelcontextprotocol/sdk': '^1.32.1'
  '@modelcontextprotocol/server-filesystem>@modelcontextprotocol/sdk': '^1.32.1'
  # The documentation site's Vue packages move together: vue pins its
  # runtime, compiler, and SSR renderer packages to its own exact version, and
  # a renderer from another release loads a second runtime-core whose
  # rendering-instance state the app's components cannot see, which empties
  # every server-rendered page. 3.5.42+ carries the GHSA-g2v6-rqmx-r4w6 fix.
  vue: '3.5.43'
  '@vue/compiler-core': '3.5.43'
  '@vue/compiler-dom': '3.5.43'
  '@vue/compiler-sfc': '3.5.43'
  '@vue/compiler-ssr': '3.5.43'
  '@vue/reactivity': '3.5.43'
  '@vue/runtime-core': '3.5.43'
  '@vue/runtime-dom': '3.5.43'
  '@vue/server-renderer': '3.5.43'
  '@vue/shared': '3.5.43'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) and lefthook
# (git hooks) genuinely need theirs.
allowBuilds:
  esbuild: true
  lefthook: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # The Python runtime deploy includes the reviewed workspace postinstall that
  # restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local@file:rsh/Core/subprocess/subprocess-local': true
  # electron-builder pulls in the optional Squirrel.Windows helper, whose
  # install script only selects its bundled 7-Zip executable. Desktop ships
  # Windows through NSIS, so that mutation is not part of our build.
  electron-winstaller: false
  # Store-index rewriting only needs msgpackr's portable JavaScript codec.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  # Fresh pi-ai releases carry the model catalog updates that are the whole
  # point of bumping it; waiting out the release age would defeat that.
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4
  # The active pnpm supply-chain policy blocks this reviewed runtime closure
  # until its release-age window expires unless every exact package is exempt.
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.263'
  - '@anthropic-ai/claude-agent-sdk@0.3.263'
  # Platform aliases resolve to the @openai/codex package name; review the
  # exact wrapper and payload versions together.
  - '@openai/codex@0.159.0 || 0.159.0-darwin-arm64 || 0.159.0-darwin-x64 || 0.159.0-linux-arm64 || 0.159.0-linux-x64 || 0.159.0-win32-arm64 || 0.159.0-win32-x64'

patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
  '@yao-pkg/pkg@6.21.0': patches/@yao-pkg__pkg@6.21.0.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
